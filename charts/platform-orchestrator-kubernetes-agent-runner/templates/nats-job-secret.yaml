{{- if and .Values.nats.token (not .Values.nats.jobCredentialsExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}-nats-job
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.deploymentJobNamespace" . }}
  labels:
    {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.nats.tokenKey }}: {{ .Values.nats.token | quote }}
{{- end }}
