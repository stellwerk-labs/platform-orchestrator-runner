{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform-orchestrator-kubernetes-agent-runner.serviceAccountName" . }}
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.deploymentJobNamespace" . | quote }}
  labels:
    {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods
      - events
    verbs:
      - list
{{- end }}