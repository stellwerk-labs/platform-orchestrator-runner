apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}
  labels:
    {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 4 }}
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.namespace" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform-orchestrator-kubernetes-agent-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-orchestrator-kubernetes-agent-runner.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/runner/runner"]
          args: ["remote"]
          envFrom:
            - configMapRef:
                name: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}
          env:
            {{- if .Values.gateway.privateKeyExistingSecret }}
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.privateKeyExistingSecret | quote }}
                  key: {{ .Values.gateway.privateKeyKey }}
            {{- end }}
            {{- if .Values.gateway.clientCertificateExistingSecret }}
            - name: RUNNER_GATEWAY_CLIENT_CERT_FILE
              value: /etc/runner-gateway/tls.crt
            - name: RUNNER_GATEWAY_CLIENT_KEY_FILE
              value: /etc/runner-gateway/tls.key
            {{- end }}
            {{- with .Values.platformOrchestrator.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.gateway.caExistingSecret .Values.gateway.clientCertificateExistingSecret .Values.volumeMounts }}
          volumeMounts:
            {{- if or .Values.gateway.caExistingSecret .Values.gateway.clientCertificateExistingSecret }}
            - name: gateway-tls
              mountPath: /etc/runner-gateway
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.gateway.caExistingSecret .Values.gateway.clientCertificateExistingSecret .Values.volumes }}
      volumes:
        {{- if or .Values.gateway.caExistingSecret .Values.gateway.clientCertificateExistingSecret }}
        - name: gateway-tls
          projected:
            sources:
              {{- if .Values.gateway.caExistingSecret }}
              - secret:
                  name: {{ .Values.gateway.caExistingSecret }}
                  items:
                    - key: {{ .Values.gateway.caKey }}
                      path: ca.crt
              {{- end }}
              {{- if .Values.gateway.clientCertificateExistingSecret }}
              - secret:
                  name: {{ .Values.gateway.clientCertificateExistingSecret }}
                  items:
                    - key: {{ .Values.gateway.clientCertificateKey }}
                      path: tls.crt
                    - key: {{ .Values.gateway.clientKeyKey }}
                      path: tls.key
              {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
