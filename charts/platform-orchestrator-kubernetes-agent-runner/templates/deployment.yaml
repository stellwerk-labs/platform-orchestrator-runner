apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}
  labels:
    {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 4 }}
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.namespace" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform-orchestrator-kubernetes-agent-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-orchestrator-kubernetes-agent-runner.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/runner/runner"]
          args:
            - "remote"
          envFrom:
          - configMapRef:
              name: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}
          env:
          {{- if and (eq .Values.nats.authType "token") (or .Values.nats.existingSecret .Values.nats.token) }}
          - name: NATS_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ default (include "platform-orchestrator-kubernetes-agent-runner.fullname" .) .Values.nats.existingSecret }}
                key: {{ .Values.nats.tokenKey }}
          {{- end }}
          {{- if eq .Values.nats.authType "credentials" }}
          - name: NATS_CREDS_FILE
            value: /etc/nats-auth/creds
          {{- end }}
          {{- if .Values.nats.caEnabled }}
          - name: NATS_CA_FILE
            value: /etc/nats-auth/ca.crt
          {{- end }}
          {{- with .Values.platformOrchestrator.extraEnvVars }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.outbox.enabled .Values.volumeMounts (and .Values.nats.existingSecret (or (eq .Values.nats.authType "credentials") .Values.nats.caEnabled)) }}
          volumeMounts:
            {{- if .Values.outbox.enabled }}
            - name: nats-outbox
              mountPath: /var/lib/platform-orchestrator-runner/outbox
            {{- end }}
            {{- if and .Values.nats.existingSecret (or (eq .Values.nats.authType "credentials") .Values.nats.caEnabled) }}
            - name: nats-auth
              mountPath: /etc/nats-auth
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.outbox.enabled .Values.volumes (and .Values.nats.existingSecret (or (eq .Values.nats.authType "credentials") .Values.nats.caEnabled)) }}
      volumes:
        {{- if .Values.outbox.enabled }}
        - name: nats-outbox
          persistentVolumeClaim:
            claimName: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}-outbox
        {{- end }}
        {{- if and .Values.nats.existingSecret (or (eq .Values.nats.authType "credentials") .Values.nats.caEnabled) }}
        - name: nats-auth
          secret:
            secretName: {{ .Values.nats.existingSecret }}
            items:
              {{- if eq .Values.nats.authType "credentials" }}
              - key: {{ .Values.nats.credentialsKey }}
                path: creds
              {{- end }}
              {{- if .Values.nats.caEnabled }}
              - key: {{ .Values.nats.caKey }}
                path: ca.crt
              {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
