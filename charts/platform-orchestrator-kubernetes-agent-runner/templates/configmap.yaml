{{- if not (has .Values.gateway.mode (list "simple" "edge" "airgap")) -}}{{- fail "gateway.mode must be simple, edge, or airgap" -}}{{- end -}}
{{- $configured := or .Values.platformOrchestrator.orgId .Values.platformOrchestrator.runnerId -}}
{{- if and $configured (not (and .Values.platformOrchestrator.orgId .Values.platformOrchestrator.runnerId)) -}}{{- fail "platformOrchestrator.orgId and platformOrchestrator.runnerId must be configured together" -}}{{- end -}}
{{- if and $configured (not .Values.gateway.privateKeyExistingSecret) -}}{{- fail "gateway.privateKeyExistingSecret is required" -}}{{- end -}}
{{- if and $configured (ne .Values.gateway.mode "airgap") (not .Values.gateway.url) -}}{{- fail "gateway.url is required in simple and edge modes" -}}{{- end -}}
{{- if and (eq .Values.gateway.mode "edge") (not .Values.outbox.enabled) -}}{{- fail "gateway.mode=edge requires outbox.enabled=true" -}}{{- end -}}
{{- if and (ne .Values.gateway.mode "edge") .Values.outbox.enabled -}}{{- fail "outbox.enabled is supported only when gateway.mode=edge" -}}{{- end -}}
{{- $gatewayURL := .Values.gateway.url -}}
{{- if eq .Values.gateway.mode "airgap" -}}
{{- $gatewayURL = printf "http://%s-protected-gateway:8080/runner-gateway" (include "platform-orchestrator-kubernetes-agent-runner.fullname" .) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.namespace" . }}
  name: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}
  labels:
    {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 4 }}
data:
  ORG_ID: {{ .Values.platformOrchestrator.orgId | quote }}
  RUNNER_ID: {{ .Values.platformOrchestrator.runnerId | quote }}
  LOG_LEVEL: {{ .Values.platformOrchestrator.logLevel | quote }}
  RUNNER_GATEWAY_URL: {{ $gatewayURL | quote }}
  {{- if .Values.gateway.caExistingSecret }}
  RUNNER_GATEWAY_CA_FILE: /etc/runner-gateway/ca.crt
  RUNNER_GATEWAY_JOB_CA_SECRET: {{ default .Values.gateway.caExistingSecret .Values.gateway.jobCaExistingSecret | quote }}
  RUNNER_GATEWAY_JOB_CA_KEY: {{ .Values.gateway.caKey | quote }}
  {{- end }}
  {{- if .Values.outbox.enabled }}
  RUNNER_GATEWAY_JOB_OUTBOX_PVC: {{ printf "%s-job-outbox" (include "platform-orchestrator-kubernetes-agent-runner.fullname" .) | quote }}
  {{- end }}
