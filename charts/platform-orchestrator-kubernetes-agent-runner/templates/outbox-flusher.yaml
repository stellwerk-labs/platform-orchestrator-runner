{{- if .Values.outbox.enabled }}
{{- $gatewayURL := .Values.gateway.url -}}
{{- if eq .Values.gateway.mode "airgap" -}}
{{- $gatewayURL = printf "http://%s-protected-gateway:8080/runner-gateway" (include "platform-orchestrator-kubernetes-agent-runner.fullname" .) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}-outbox-flusher
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.deploymentJobNamespace" . }}
  labels:
    {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-flusher
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform-orchestrator-kubernetes-agent-runner.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: outbox-flusher
  template:
    metadata:
      labels:
        {{- include "platform-orchestrator-kubernetes-agent-runner.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: outbox-flusher
    spec:
      serviceAccountName: {{ .Values.jobsRbac.serviceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: outbox-flusher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/runner/runner"]
          args: ["outbox-flush"]
          env:
            - {name: ORG_ID, value: {{ .Values.platformOrchestrator.orgId | quote }}}
            - {name: RUNNER_ID, value: {{ .Values.platformOrchestrator.runnerId | quote }}}
            - {name: RUNNER_GATEWAY_URL, value: {{ $gatewayURL | quote }}}
            - {name: RUNNER_GATEWAY_OUTBOX_DIR, value: /var/lib/platform-orchestrator-runner/outbox}
            {{- if .Values.gateway.caExistingSecret }}
            - {name: RUNNER_GATEWAY_CA_FILE, value: /etc/runner-gateway/ca.crt}
            {{- end }}
          volumeMounts:
            - name: gateway-outbox
              mountPath: /var/lib/platform-orchestrator-runner/outbox
            {{- if .Values.gateway.caExistingSecret }}
            - name: gateway-ca
              mountPath: /etc/runner-gateway
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: gateway-outbox
          persistentVolumeClaim:
            claimName: {{ include "platform-orchestrator-kubernetes-agent-runner.fullname" . }}-job-outbox
        {{- if .Values.gateway.caExistingSecret }}
        - name: gateway-ca
          secret:
            secretName: {{ default .Values.gateway.caExistingSecret .Values.gateway.jobCaExistingSecret }}
            items:
              - key: {{ .Values.gateway.caKey }}
                path: ca.crt
        {{- end }}
{{- end }}
