{{- if and .Values.jobsRbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.jobsRbac.serviceAccountName | quote }}
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.deploymentJobNamespace" . | quote }}
  labels:
    {{- include "platform-orchestrator-kubernetes-agent-runner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.jobsRbac.serviceAccountName | quote }}
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.deploymentJobNamespace" . | quote }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - update
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - leases
    verbs:
      - create
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.jobsRbac.serviceAccountName | quote }}
  namespace: {{ include "platform-orchestrator-kubernetes-agent-runner.deploymentJobNamespace" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.jobsRbac.serviceAccountName | quote }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.jobsRbac.serviceAccountName | quote }}
{{- end }}
