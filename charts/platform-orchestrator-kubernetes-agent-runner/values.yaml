# Default values for platform-orchestrator-kubernetes-agent-runner.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

platformOrchestrator:
  # The Platform Orchestrator Organization.
  orgId: ""
  # The id of the kubernetes-agent runner registered in Platform Orchestrator.
  runnerId: ""
  # Additional runtime environment variables for the Agent.
  extraEnvVars: []
  # The log level for the runner. One of: debug, info, warn, error
  logLevel: "info"

# Public runner transport. The agent only initiates HTTPS requests. In airgap
# mode the URL is replaced with the protected-side gateway Service.
gateway:
  mode: simple
  url: ""
  privateKeyExistingSecret: ""
  privateKeyKey: private-key.pem
  caExistingSecret: ""
  caKey: ca.crt
  clientCertificateExistingSecret: ""
  clientCertificateKey: tls.crt
  clientKeyKey: tls.key
  # Secret containing the gateway CA in the namespace where deployment Jobs run.
  jobCaExistingSecret: ""

outbox:
  enabled: false
  storageClassName: ""
  size: 1Gi
  accessModes:
    - ReadWriteMany

# Optional minimal protected-side broker for air-gapped compartments. Commands
# enter it only through the signed diode importer; it is never clustered across
# the boundary.
protected-nats:
  enabled: false
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 2Gi
    merge:
      authorization:
        token: << $NATS_AUTH_TOKEN >>
  container:
    env:
      NATS_AUTH_TOKEN:
        valueFrom:
          secretKeyRef:
            name: ""
            key: token
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

protectedNatsBootstrap:
  image: natsio/nats-box:0.19.5

airgap:
  # Existing Secret in the runner namespace. The public key must match the
  # private key used by the agent. runnerTokenSalt must match the central data
  # plane so protected deployment jobs can authenticate their result uploads.
  gatewaySecret: ""
  publicKeyKey: public-key.pem
  runnerTokenSaltKey: runner-token-salt
  receiptKeyKey: receipt-key
  nats:
    url: ""
    authType: token
    existingSecret: ""
    tokenKey: token
    credentialsKey: creds
    caKey: ca.crt
    caEnabled: false

# File-transfer relay endpoints for an external one-way diode device. Install
# role=central outside the compartment and role=protected inside it. Each side
# mounts its own diode endpoint; the chart does not claim a network path across
# the boundary.
diode:
  enabled: false
  role: protected
  existingClaim: ""
  signingKeyExistingSecret: ""
  signingKey: signing-key.pem
  verificationKeyExistingSecret: ""
  verificationKey: verification-key.pem
  commandSubject: ""

replicaCount: 1

image:
  repository: ghcr.io/stellwerk-labs/platform-orchestrator-runner
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
# String to partially override platform-orchestrator-kubernetes-agent-runner.fullname template (will maintain the release name)
nameOverride: ""
# String to fully override platform-orchestrator-kubernetes-agent-runner.fullname template
fullnameOverride: ""
# namespaceOverride String to fully override platform-orchestrator-kubernetes-agent-runner.namespace.
namespaceOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # @schema
  # additionalProperties: true
  # @schema
  annotations: {}
  name: ""

rbac:
  #rbac.create Whether to create & use RBAC resources or not
  #
  create: true

# jobsRbac.create Whether to create & use RBAC resources for runner job or not
jobsRbac:
  create: true
  # The name of the service account to use for the runner job and specified in the kubernetes-agent configuration in the Platform Orchestrator
  # It should be different from the main service account used by the kubernetes-agent deployment
  serviceAccountName: "kubernetes-runner-job"
  # Namespace where the runner jobs and the role they run with will be created. If not set, it will use the same namespace as the deployment
  namespace: ""

## commonLabels Labels to add to all deployed objects
commonLabels: {}

# commonAnnotations Annotations to add to all deployed objects
commonAnnotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: Always
  runAsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: "0.250"
    memory: 256Mi
  requests:
    cpu: "0.025"
    memory: 128Mi



volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
