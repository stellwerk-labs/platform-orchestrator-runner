services:
  nats:
    image: nats:2.14.0-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
  platform-orchestrator-cp-platform-orchestrator-cp:
    environment:
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      VAULT_AUTH: token:mytoken
      DATA_PLANE_URL: http://platform-orchestrator-dp-platform-orchestrator-dp:8080
    depends_on:
      platform-orchestrator-iam-ready:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
  platform-orchestrator-dp-platform-orchestrator-dp:
    environment:
      NATS_BOOTSTRAP: "true"
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
      DEPLOYMENTS_COMPLETED_BEFORE: 10s
      VAULT_AUTH: token:mytoken
      INTERNAL_DATAPLANE_URL: http://localhost:8080
    depends_on:
      nats:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      platform-orchestrator-iam-ready:
        condition: service_completed_successfully
  platform-orchestrator-iam-platform-orchestrator-iam:
    environment:
      NATS_BOOTSTRAP_STREAMS: "true"
      LOG_LEVEL: debug
      DD_AGENT_HOST: ""
      SHUTDOWN_DELAY: 1s
    depends_on:
      nats:
        condition: service_healthy
  platform-orchestrator-iam-ready:
    image: nats:2.14.0-alpine
    entrypoint: ["sh", "-c"]
    command:
      - timeout 60 sh -c 'until wget --spider -q http://platform-orchestrator-iam-platform-orchestrator-iam:8080/health; do sleep 1; done'
    depends_on:
      platform-orchestrator-iam-platform-orchestrator-iam:
        condition: service_started
  vault:
    image: hashicorp/vault:1.14
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: mytoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
  vault-init:
    image: hashicorp/vault:1.14
    environment:
      VAULT_TOKEN: mytoken
      VAULT_ADDR: http://vault:8200
    depends_on:
      vault:
        condition: service_started
    command:
      - "sh"
      - "-ec"
      - |
        timeout 60 sh -c 'until vault status >/dev/null; do sleep 1; done'
        vault secrets list -format=json | grep -q '"transit/"' || vault secrets enable transit
volumes:
  nats-data:
