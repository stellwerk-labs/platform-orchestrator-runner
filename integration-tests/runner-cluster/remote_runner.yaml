apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-orchestrator-runner
  namespace: platform-orchestrator-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-orchestrator-runner
  template:
    metadata:
      labels:
        app: platform-orchestrator-runner
    spec:
      serviceAccountName: platform-orchestrator-runner-remote
      containers:
      - name: platform-orchestrator-runner
        image: stellwerk-labs/platform-orchestrator-runner:test
        command: ["/opt/runner/runner"]
        args:
          - "--remote-connect=http://platform-orchestrator-dp-platform-orchestrator-dp:8080"
          - "remote"
        env:
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: private-key-secret
              key: private_key.pem
        - name: RUNNER_ID
          value: remote-runner
        - name: ORG_ID
          value: ${ORG_ID}
        - name: LOG_LEVEL
          value: debug
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: "0.025"
            memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-orchestrator-runner-remote
  namespace: platform-orchestrator-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-orchestrator-runner-remote
  namespace: platform-orchestrator-runner
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods
      - events
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-orchestrator-runner-remote
  namespace: platform-orchestrator-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-orchestrator-runner-remote
subjects:
- kind: ServiceAccount
  name: platform-orchestrator-runner-remote
