apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-gateway
  namespace: platform-orchestrator-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner-gateway
  template:
    metadata:
      labels:
        app: runner-gateway
    spec:
      containers:
      - name: gateway
        image: stellwerk-labs/platform-orchestrator-runner:test
        imagePullPolicy: Never
        command: ["/opt/runner/runner"]
        args: ["gateway"]
        env:
        - name: NATS_URL
          value: nats://nats:4222
        - name: CONTROL_PLANE_URL
          value: http://platform-orchestrator-cp-platform-orchestrator-cp:8080
        - name: RUNNER_TOKEN_SALT
          value: vnXd0Ses8L1X0TGGcp+mf/V8dQs+L4/fWvijORwb7lI=
        - name: RUNNER_GATEWAY_RECEIPT_KEY
          value: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        readinessProbe:
          httpGet:
            path: /runner-gateway/healthz
            port: 8080
          periodSeconds: 1
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: "0.025"
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: runner-gateway
  namespace: platform-orchestrator-runner
spec:
  selector:
    app: runner-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
