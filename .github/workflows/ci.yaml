name: CI

on:
  push:
    branches-ignore:
      - "release/module-management-rc.*"
    tags-ignore:
      - "v*-rc.*"
      - "v*.*.*"

env:
  DOCKER_BUILDKIT: "1"

jobs:
  native-kubernetes-backend:
    name: Native Kubernetes state backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOENV: 'off'
      GOTOOLCHAIN: go1.26.11
      GOWORK: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install checksum-pinned existing backend test tools
        timeout-minutes: 5
        run: |
          set -eu
          umask 077
          tools="$RUNNER_TEMP/native-backend-tools"
          mkdir -p "$tools"
          curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 120 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$tools/kind"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $tools/kind" | sha256sum -c -
          chmod 0755 "$tools/kind"
          curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 120 \
            https://releases.hashicorp.com/terraform/1.17.2/terraform_1.17.2_linux_amd64.zip -o "$tools/terraform.zip"
          echo "e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b  $tools/terraform.zip" | sha256sum -c -
          unzip -q "$tools/terraform.zip" terraform -d "$tools"
          rm "$tools/terraform.zip"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Install the shipped OpenTofu
        timeout-minutes: 10
        run: |
          set -eu
          docker buildx build --target tofu-test-export --output "type=local,dest=$RUNNER_TEMP/native-backend-tools" .
          chmod 0755 "$RUNNER_TEMP/native-backend-tools/tofu"
          "$RUNNER_TEMP/native-backend-tools/tofu" version
          terraform version
      - name: Start an invocation-owned Kubernetes cluster
        timeout-minutes: 5
        run: |
          set -eu
          umask 077
          cluster="native-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          config="$RUNNER_TEMP/native-backend-admin.yaml"
          echo "NATIVE_BACKEND_CLUSTER=$cluster" >> "$GITHUB_ENV"
          echo "NATIVE_BACKEND_ADMIN_CONFIG=$config" >> "$GITHUB_ENV"
          kind create cluster --name "$cluster" --kubeconfig "$config" --wait 90s \
            --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      - name: Qualify actual Terraform and OpenTofu backend execution
        timeout-minutes: 10
        run: |
          make generate
          make test-native-kubernetes-backend
      - name: Remove only the invocation-owned cluster and admin credential
        if: always()
        run: |
          set -eu
          if [ -n "${NATIVE_BACKEND_CLUSTER:-}" ]; then
            case "$NATIVE_BACKEND_CLUSTER" in native-backend-*) kind delete cluster --name "$NATIVE_BACKEND_CLUSTER" --kubeconfig "$RUNNER_TEMP/native-backend-admin.yaml";; *) exit 1;; esac
          fi
          rm -f "$RUNNER_TEMP/native-backend-admin.yaml"

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test release publication contract
        run: python3 scripts/candidate-release_test.py

      - name: Verify Docker excludes private shell inputs and build outputs
        run: python3 scripts/release_build_context_test.py

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # run code generation step if it exists
      - name: Generate code
        run: make generate

      # run go mod tidy - this will ensure that the committer or bot has also run go mod tidy before they commit
      - name: Tidy go mod
        run: go mod tidy

      # ensure the code generation step didn't modify any checked in files
      - name: Check git diff is clean
        run: |
          git diff --exit-code

      - name: Check known Go vulnerabilities
        run: |
          go test ./scripts/vendorcheck
          sh scripts/check-go-security.sh

      - name: Prepare authenticated OpenTofu notice inputs
        run: |
          set -eu
          umask 077
          opentofu_work="$(mktemp -d "$RUNNER_TEMP/opentofu-notices.XXXXXX")"
          sh scripts/prepare-opentofu.sh "$opentofu_work/build"
          opentofu_go="$(GOTOOLCHAIN=go1.27.4 go env GOROOT)/bin/go"
          OPENTOFU_GO="$opentofu_go" sh scripts/build-opentofu.sh "$opentofu_work/build/source" "$opentofu_work/tofu-amd64" amd64
          OPENTOFU_GO="$opentofu_go" sh scripts/build-opentofu.sh "$opentofu_work/build/source" "$opentofu_work/tofu-arm64" arm64
          printf 'OPENTOFU_BUILD_DIR=%s\nOPENTOFU_GO=%s\nOPENTOFU_BINARY_AMD64=%s\nOPENTOFU_BINARY_ARM64=%s\n' \
            "$opentofu_work/build" "$opentofu_go" "$opentofu_work/tofu-amd64" "$opentofu_work/tofu-arm64" >> "$GITHUB_ENV"

      - name: Qualify complete production notices and fail-closed final copy
        run: |
          sh scripts/install-go-licenses.sh "$RUNNER_TEMP/notice-tools"
          export PATH="$RUNNER_TEMP/notice-tools:$PATH"
          python3 -B scripts/notices_test.py

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install shipped OpenTofu and Infracost for native tests
        run: |
          set -eu
          umask 077
          test_tools="$(mktemp -d "$RUNNER_TEMP/pipeline-tools.XXXXXX")"
          docker buildx build --target pipeline-test-export --output "type=local,dest=$test_tools" .
          test -f "$test_tools/tofu"
          test -f "$test_tools/infracost"
          curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 20 --max-time 120 \
            https://releases.hashicorp.com/terraform/1.17.2/terraform_1.17.2_linux_amd64.zip -o "$test_tools/terraform.zip"
          echo "e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b  $test_tools/terraform.zip" | sha256sum -c -
          unzip -q "$test_tools/terraform.zip" terraform -d "$test_tools"
          rm "$test_tools/terraform.zip"
          chmod 0755 "$test_tools/tofu" "$test_tools/infracost" "$test_tools/terraform"
          "$test_tools/terraform" version
          "$test_tools/tofu" version
          "$test_tools/infracost" --version
          printf '%s\n' "$test_tools" >> "$GITHUB_PATH"
          printf 'INFRACOST_TEST_BINARY=%s\n' "$test_tools/infracost" >> "$GITHUB_ENV"

      - name: Run Go Tests
        run: |
          GOFLAGS=-coverprofile=cover.out make test-unit

      - name: Qualify native pipeline delivery with real Gateway and NATS
        timeout-minutes: 5
        run: |
          docker pull nats@sha256:ddb480f4b97d90f183123e96bbc7c96ab2a126883f7a380531cc208fc8ba9ca7
          make test-agent-delivery-integration

      - name: Refuse unsupported native NATS custody mutation
        timeout-minutes: 5
        run: |
          docker pull nats@sha256:d402af4147fc7ba334ecc45b1cb14a6f46f32ad6a36873fbd1a6a37ce42452dd
          make test-unsupported-native-nats

      - name: Qualify shared pipeline queue and worker fencing
        timeout-minutes: 20
        run: |
          docker pull nats@sha256:ddb480f4b97d90f183123e96bbc7c96ab2a126883f7a380531cc208fc8ba9ca7
          docker pull postgres@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
          make test-rollout-ha-integration

      - name: Check shipped Runner and OpenTofu executables
        run: docker buildx build --no-cache-filter security --target final --build-arg RELEASE_VERSION=v3.3.0 --sbom=true --provenance=mode=max --output "type=oci,dest=$RUNNER_TEMP/runner-final-preflight.tar" .

      - name: Execute legacy artifact upgrade and rollback with the shipped OpenTofu
        run: docker build --target artifact-integration .

      - name: Collect unit test coverage
        run: |
          if [ -f cover.out ]; then
            go tool cover -html=cover.out -o coverage.html
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            cover.out
            coverage.html

  test-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
    env:
      CP_IMAGE: ${{ vars.CORE_CP_INTEGRATION_IMAGE }}
      IAM_IMAGE: ${{ vars.CORE_IAM_INTEGRATION_IMAGE }}
      DP_IMAGE: ${{ vars.CORE_DP_INTEGRATION_IMAGE }}
      RELEASE_VERSION: v3.3.0
    steps:
      - name: Require the compatible Core candidate image set
        shell: bash
        run: |
          for image_variable in CP_IMAGE IAM_IMAGE DP_IMAGE; do
            if [[ ! "${!image_variable}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Set CORE_${image_variable%_IMAGE}_INTEGRATION_IMAGE to the compatible image digest recorded in the OSS release manifest. Pre-module-management fallback images are not valid."
              exit 1
            fi
          done
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Go cache for Docker
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            go-build-cache
            go-mod-cache
          key: ${{ runner.os }}-docker-go-cache-${{ hashFiles('**/go.sum') }}

      - name: inject go-mod-cache into docker
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "go-build-cache": "/root/.cache/go-build",
              "go-mod-cache": "/go/pkg/mod"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Setup Score Compose
        uses: score-spec/setup-score@v3.2.4
        with:
          file: score-compose
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: score-compose --version

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: make test-integration

      - name: Show integration test logs
        run: |
          set +e
          make -q test-integration-logs
          if test $? -le 1; then
            make test-integration-logs
          else
            docker compose logs
          fi
        if: always()

      - run: make clean

  lint-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6.2.1

  helm-validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: '4.3.0'

    - name: Build chart dependencies
      run: |
        helm repo add nats https://nats-io.github.io/k8s/helm/charts/
        helm dependency build ./charts/platform-orchestrator-kubernetes-agent-runner

    - name: Test chart metadata parser
      run: bash scripts/chart-metadata_test.sh

    - name: Helm Lint
      run: |
        helm lint ./charts/platform-orchestrator-kubernetes-agent-runner
        
    - name: Helm Template
      run: |
        helm template platform-orchestrator-kubernetes-agent-runner ./charts/platform-orchestrator-kubernetes-agent-runner

    - name: Test runner gateway modes
      run: bash scripts/chart-gateway-modes_test.sh

  
