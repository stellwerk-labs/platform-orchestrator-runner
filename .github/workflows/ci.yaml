name: CI

on:
  push:
    branches-ignore:
      - "release/module-management-rc.*"
    tags-ignore:
      - "v*-rc.*"
      - "v*.*.*"

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test release publication contract
        run: python3 scripts/candidate-release_test.py

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # run code generation step if it exists
      - name: Generate code
        run: make generate

      # run go mod tidy - this will ensure that the committer or bot has also run go mod tidy before they commit
      - name: Tidy go mod
        run: go mod tidy

      # ensure the code generation step didn't modify any checked in files
      - name: Check git diff is clean
        run: |
          git diff --exit-code

      - name: Run Go Tests
        run: |
          GOFLAGS=-coverprofile=cover.out make test-unit

      - name: Execute legacy artifact upgrade and rollback with the shipped OpenTofu
        run: docker build --target artifact-integration .

      - name: Collect unit test coverage
        run: |
          if [ -f cover.out ]; then
            go tool cover -html=cover.out -o coverage.html
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            cover.out
            coverage.html

  test-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
    env:
      CP_IMAGE: ${{ vars.CORE_CP_INTEGRATION_IMAGE }}
      IAM_IMAGE: ${{ vars.CORE_IAM_INTEGRATION_IMAGE }}
      DP_IMAGE: ${{ vars.CORE_DP_INTEGRATION_IMAGE }}
    steps:
      - name: Require the compatible Core candidate image set
        shell: bash
        run: |
          for image_variable in CP_IMAGE IAM_IMAGE DP_IMAGE; do
            if [[ ! "${!image_variable}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Set CORE_${image_variable%_IMAGE}_INTEGRATION_IMAGE to the compatible image digest recorded in the OSS release manifest. Pre-module-management fallback images are not valid."
              exit 1
            fi
          done
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Go cache for Docker
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            go-build-cache
            go-mod-cache
          key: ${{ runner.os }}-docker-go-cache-${{ hashFiles('**/go.sum') }}

      - name: inject go-mod-cache into docker
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "go-build-cache": "/root/.cache/go-build",
              "go-mod-cache": "/go/pkg/mod"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Setup Score Compose
        uses: score-spec/setup-score@v3.2.4
        with:
          file: score-compose
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: score-compose --version

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: make test-integration

      - name: Show integration test logs
        run: |
          set +e
          make -q test-integration-logs
          if test $? -le 1; then
            make test-integration-logs
          else
            docker compose logs
          fi
        if: always()

      - run: make clean

  lint-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6.2.1

  helm-validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: '3.12.0'

    - name: Build chart dependencies
      run: |
        helm repo add nats https://nats-io.github.io/k8s/helm/charts/
        helm dependency build ./charts/platform-orchestrator-kubernetes-agent-runner

    - name: Test chart metadata parser
      run: bash scripts/chart-metadata_test.sh

    - name: Helm Lint
      run: |
        helm lint ./charts/platform-orchestrator-kubernetes-agent-runner
        
    - name: Helm Template
      run: |
        helm template platform-orchestrator-kubernetes-agent-runner ./charts/platform-orchestrator-kubernetes-agent-runner

    - name: Test runner gateway modes
      run: bash scripts/chart-gateway-modes_test.sh

  
