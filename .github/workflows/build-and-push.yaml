name: Build and push image to public ghcr registry
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Pre-existing approved vX.Y.Z-rc.N tag (never stable/latest)"
        required: true
        type: string
      candidate_sha:
        description: "Approved full 40-character commit SHA identified by that tag"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

jobs:
  require-candidate-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require the approved candidate workflow
        run: |
          echo '::error::Select the approved release/module-management-rc.1 ref. This default-branch workflow cannot publish release candidates.'
          exit 1

  push-to-ghcr-registry:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          target: final
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-runner:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "$notes"
